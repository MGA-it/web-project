<main>
    <section class="page-title">
        <div class="container">
            <p class="small-title">ACCOUNT</p>
            <h1>Login <span>& Register</span></h1>
            <p>Simple forms with HTML validation.</p>
        </div>
    </section>
    <section class="account-page">
        <div class="container account-grid">
            <form class="account-card">
                <h2>Login</h2>
                <input type="email" required placeholder="Email">
                <input type="password" minlength="6" required placeholder="Password">
                <button class="btn btn-success main-btn" type="submit">Login</button>
            </form>
            <form class="account-card">
                <h2>Create Account</h2>
                <input type="text" required placeholder="Full Name">
                <input type="email" required placeholder="Email">
                <input type="password" minlength="6" required placeholder="Password">
                <button class="btn btn-success main-btn" type="submit">Register</button>
            </form>
        </div>
    </section>
</main>
